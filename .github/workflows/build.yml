name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed by the release job to publish binaries

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl2-dev libgl1-mesa-dev libmpv-dev libglib2.0-dev \
            libnotify-dev python3 python3-venv curl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          code=0
          # -j2: -j$(nproc) on the runner OOM-killed the parallel gcc jobs
          # (ytdlp.cpp is a large TU) and make died silently mid-build.
          cmake --build build -j2 > /tmp/build.log 2>&1 || code=$?
          echo "BUILD EXIT CODE: $code"
          echo "LOG LINES: $(wc -l < /tmp/build.log)"
          if [ "$code" -ne 0 ]; then
            grep -E "error:" /tmp/build.log | head -12 |
              while IFS= read -r line; do echo "::error::${line:0:400}"; done
            tail -12 /tmp/build.log |
              while IFS= read -r line; do echo "::error::TAIL ${line:0:380}"; done
            exit "$code"
          fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: /tmp/build.log
          if-no-files-found: ignore
      - name: Smoke test (binary runs, prints usage errors only)
        run: |
          ./build/crossfade --help 2>&1 | head -5 || true
          test -x ./build/crossfade
      - name: Package Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG="crossfade-${VER}-linux-x64"
          mkdir -p "dist/${PKG}"
          cp build/crossfade "dist/${PKG}/"
          cp scripts/crossfade-login "dist/${PKG}/"
          cp p100-backend.py p100-backend-oauth.py requirements.txt "dist/${PKG}/"
          cp -r assets/fonts "dist/${PKG}/assets-fonts"
          cp packaging/crossfade.desktop "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
      - name: Upload Linux package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: crossfade-linux-release
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-python
            curl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          code=0
          cmake --build build -j"$(nproc)" > /tmp/build.log 2>&1 || code=$?
          echo "BUILD EXIT CODE: $code"
          if [ "$code" -ne 0 ]; then
            grep -E "error" /tmp/build.log | head -12 |
              while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit "$code"
          fi
      - name: Bundle runtime DLLs
        run: |
          cd /ucrt64/bin
          cp SDL2.dll libmpv-2.dll libstdc++-6.dll libgcc_s_seh-1.dll \
             libwinpthread-1.dll "$GITHUB_WORKSPACE/build/"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossfade-windows
          path: |
            build/crossfade.exe
            build/SDL2.dll
            build/libmpv-2.dll
            build/libstdc++-6.dll
            build/libgcc_s_seh-1.dll
            build/libwinpthread-1.dll
            p100-backend.py
            p100-backend-oauth.py
            requirements.txt
      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $pkg = "crossfade-$ver-windows-x64"
          New-Item -ItemType Directory -Path "dist/$pkg" -Force | Out-Null
          Copy-Item build/crossfade.exe, build/SDL2.dll, build/libmpv-2.dll, `
            build/libstdc++-6.dll, build/libgcc_s_seh-1.dll, build/libwinpthread-1.dll `
            "dist/$pkg/"
          Copy-Item p100-backend.py, p100-backend-oauth.py, requirements.txt, `
            README.md, LICENSE "dist/$pkg/"
          Copy-Item packaging/windows/install.ps1, packaging/windows/install-crossfade.cmd "dist/$pkg/"
          Copy-Item assets/fonts "dist/$pkg/fonts" -Recurse
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"
      - name: Upload Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: crossfade-windows-release
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: crossfade-*-release
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
