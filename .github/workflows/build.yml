name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl2-dev libgl1-mesa-dev libmpv-dev libglib2.0-dev \
            libnotify-dev python3 python3-venv curl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee /tmp/build.log | tail -3
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface each unique compiler error as a check annotation.
            grep -E "error:" /tmp/build.log | sort -u | head -20 |
              while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit "$code"
          fi
      - name: Smoke test (binary runs, prints usage errors only)
        run: |
          ./build/crossfade --help 2>&1 | head -5 || true
          test -x ./build/crossfade

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-python
            curl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Bundle runtime DLLs
        run: |
          cd /ucrt64/bin
          cp SDL2.dll libmpv-2.dll libstdc++-6.dll libgcc_s_seh-1.dll \
             libwinpthread-1.dll "$GITHUB_WORKSPACE/build/"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossfade-windows
          path: |
            build/crossfade.exe
            build/SDL2.dll
            build/libmpv-2.dll
            build/libstdc++-6.dll
            build/libgcc_s_seh-1.dll
            build/libwinpthread-1.dll
            p100-backend.py
            p100-backend-oauth.py
            requirements.txt
