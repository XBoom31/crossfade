name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed by the release job to publish binaries

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # a new push/tag supersedes stale runs

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version metadata
        run: |
          CMAKE_VER="$(sed -n 's/^project(crossfade VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          PKG_VER="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          echo "CMakeLists=$CMAKE_VER PKGBUILD=$PKG_VER ref=$GITHUB_REF"
          if [ "$CMAKE_VER" != "$PKG_VER" ]; then
            echo "::error::CMakeLists.txt version $CMAKE_VER does not match PKGBUILD pkgver=$PKG_VER"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$CMAKE_VER" ]; then
              echo "::error::Tag v$TAG does not match CMakeLists.txt version $CMAKE_VER"
              exit 1
            fi
          fi
          # Windows installers intentionally point at the rolling "latest"
          # release so re-running them upgrades instead of re-installing a
          # pinned version. Don't let that regress to a hardcoded tag.
          grep -q 'releases/latest/download' packaging/windows/install.ps1 || {
            echo "::error::packaging/windows/install.ps1 must use releases/latest/download"
            exit 1
          }
          grep -q 'releases/latest/download' packaging/windows/install-crossfade.cmd || {
            echo "::error::packaging/windows/install-crossfade.cmd must download the latest installer"
            exit 1
          }
      - name: Check for local/private files
        run: |
          BAD="$(git ls-files | grep -E '(^|/)(browser|browseroauth|oauth)\.json$|(^|/)imgui\.ini$|(^|/)library\.db($|-)|(^|/)backend\.log$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::Private/local files are tracked:"
            echo "$BAD"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl2-dev libgl1-mesa-dev libmpv-dev libglib2.0-dev \
            libnotify-dev python3 python3-venv curl libjack0 ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCROSSFADE_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          code=0
          # -j2: -j$(nproc) on the runner OOM-killed the parallel gcc jobs
          # (ytdlp.cpp is a large TU) and make died silently mid-build.
          cmake --build build -j2 > /tmp/build.log 2>&1 || code=$?
          echo "BUILD EXIT CODE: $code"
          echo "LOG LINES: $(wc -l < /tmp/build.log)"
          if [ "$code" -ne 0 ]; then
            grep -E "error:" /tmp/build.log | head -12 |
              while IFS= read -r line; do echo "::error::${line:0:400}"; done
            tail -12 /tmp/build.log |
              while IFS= read -r line; do echo "::error::TAIL ${line:0:380}"; done
            exit "$code"
          fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: /tmp/build.log
          if-no-files-found: ignore
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: ASan/UBSan tests
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCROSSFADE_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan -j2 --target test_party_link test_party_queue test_party_util test_library test_crossfade test_cache test_json test_session test_playlists test_settings
          ctest --test-dir build-asan --output-on-failure
      - name: Verify binary exists
        run: test -x ./build/crossfade
      - name: Upload PR binary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crossfade-linux-pr
          path: build/crossfade
          if-no-files-found: error
        # No runtime smoke test yet: the app has no CLI flags, blocks in its
        # event loop once up, and currently ignores SIGTERM (needs a signal
        # handler), so a headless run cannot be terminated cleanly.
      - name: Package Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG="crossfade-${VER}-linux-x64"
          mkdir -p "dist/${PKG}"
          cp build/crossfade "dist/${PKG}/"
          cp scripts/crossfade-login "dist/${PKG}/"
          cp -r scripts "dist/${PKG}/"
          cp p100-backend.py p100-backend-oauth.py requirements.txt "dist/${PKG}/"
          cp -r py "dist/${PKG}/"
          cp -r assets/fonts "dist/${PKG}/assets-fonts"
          cp packaging/crossfade.desktop "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
      - name: Build deb and rpm packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sudo gem install fpm --no-document 2>/dev/null | tail -1
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/usr/bin" "$STAGE/usr/share/crossfade/assets"                    "$STAGE/usr/share/applications"                    "$STAGE/usr/share/icons/hicolor/scalable/apps"
          cp build/crossfade "$STAGE/usr/bin/"
          cp scripts/crossfade-login "$STAGE/usr/bin/"
          mkdir -p "$STAGE/usr/share/crossfade/scripts"
          cp scripts/crossfade-login-helper.py "$STAGE/usr/share/crossfade/scripts/"
          cp p100-backend.py p100-backend-oauth.py requirements.txt "$STAGE/usr/share/crossfade/"
          mkdir -p "$STAGE/usr/share/crossfade/py"
          cp -r py/cf_backend "$STAGE/usr/share/crossfade/py/"
          cp -r assets/fonts "$STAGE/usr/share/crossfade/assets/"
          cp packaging/crossfade.desktop "$STAGE/usr/share/applications/"
          cp assets/crossfade.svg "$STAGE/usr/share/icons/hicolor/scalable/apps/"
          chmod +x packaging/linux/after-install.sh
          # deb: libmpv package name differs across releases (libmpv1 on
          # Ubuntu 20.04, libmpv2 on 22.04+/Debian 12) — allow either.
          fpm -s dir -t deb -n crossfade -v "$VER" --iteration 1               --description "A native YouTube Music desktop player with real crossfade"               --url "https://github.com/XBoom31/crossfade" --license "MIT"               --depends "libsdl2-2.0-0" --depends "libglib2.0-0" --depends "libnotify4"               --depends "libmpv2 | libmpv1" --depends "python3 (>= 3.8)"               --depends "python3-venv" --depends "python3-pip" --depends "curl"               --after-install packaging/linux/after-install.sh               -C "$STAGE" -p "dist/crossfade-${VER}-amd64.deb" usr
          # rpm: mpv-libs lives in RPM Fusion on Fedora — the app needs it.
          fpm -s dir -t rpm -n crossfade -v "$VER" --iteration 1               --description "A native YouTube Music desktop player with real crossfade"               --url "https://github.com/XBoom31/crossfade" --license "MIT"               --depends "SDL2" --depends "glib2" --depends "libnotify"               --depends "mpv-libs" --depends "python3"               --after-install packaging/linux/after-install.sh               -C "$STAGE" -p "dist/crossfade-${VER}-x86_64.rpm" usr
      - name: Build AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications                    AppDir/usr/share/icons/hicolor/scalable/apps                    AppDir/usr/share/crossfade/assets
          # The GUI binary moves aside; usr/bin/crossfade is the launcher that
          # bootstraps the user-space venv (squashfs is read-only).
          cp build/crossfade AppDir/usr/bin/crossfade.bin
          cp packaging/linux/crossfade-appimage-wrapper.sh AppDir/usr/bin/crossfade
          chmod +x AppDir/usr/bin/crossfade
          cp p100-backend.py p100-backend-oauth.py requirements.txt AppDir/usr/share/crossfade/
          mkdir -p AppDir/usr/share/crossfade/scripts
          cp scripts/crossfade-login-helper.py AppDir/usr/share/crossfade/scripts/
          mkdir -p AppDir/usr/share/crossfade/py
          cp -r py/cf_backend AppDir/usr/share/crossfade/py/
          cp -r assets/fonts AppDir/usr/share/crossfade/assets/
          cp packaging/crossfade.desktop AppDir/usr/share/applications/
          cp assets/crossfade.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          sudo apt-get install -y librsvg2-bin >/dev/null 2>&1 || true
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          rsvg-convert -w 256 -h 256 assets/crossfade.svg               -o AppDir/usr/share/icons/hicolor/256x256/apps/crossfade.png || true
          export P100_SOURCE_DIR="$PWD"
          # linuxdeploy treats libjack as a system library and leaves it out of
          # the bundle even though libmpv dlopens it. Ship it explicitly and
          # let the launcher put AppDir/usr/lib on the loader path.
          JACK_LIB="$(ldconfig -p | awk '/libjack\.so\.0/ {print $NF; exit}')"
          if [ -n "$JACK_LIB" ]; then
            mkdir -p AppDir/usr/lib
            cp -L "$JACK_LIB" AppDir/usr/lib/
          else
            echo "::warning::libjack.so.0 not found; AppImage may fail on systems without JACK"
          fi
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run               --appdir AppDir --output appimage
          mkdir -p dist
          # Move the packaging tool away first, so the only *.AppImage left in
          # the directory is the one linuxdeploy just built for us.
          mv linuxdeploy-x86_64.AppImage /tmp/
          PRODUCT=$(find . -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$PRODUCT"
          mv "$PRODUCT" "dist/crossfade-${VER}-x86_64.AppImage"
      - name: Upload Linux packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: crossfade-linux-release
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config \
            libsdl2-dev libgl1-mesa-dev libmpv-dev libglib2.0-dev \
            libnotify-dev python3 python3-venv curl libjack0
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: ThreadSanitizer tests
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          cmake --build build-tsan -j2 --target test_party_link test_party_queue test_party_util test_library test_crossfade test_cache test_json test_session test_playlists test_settings
          TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-tsan --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: python -m pip install --upgrade pip ruff
      - name: Compile backends
        run: python -m py_compile p100-backend.py p100-backend-oauth.py py/cf_backend/core.py tests/test_backend_protocol.py
      - name: Lint (syntax/undefined names)
        run: ruff check --select E9,F63,F7,F82 p100-backend.py p100-backend-oauth.py py/cf_backend tests/test_backend_protocol.py
      - name: Protocol regression test
        run: python tests/test_backend_protocol.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-python
            curl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCROSSFADE_BUILD_TESTS=ON
      - name: Build
        run: |
          code=0
          cmake --build build -j"$(nproc)" > /tmp/build.log 2>&1 || code=$?
          echo "BUILD EXIT CODE: $code"
          if [ "$code" -ne 0 ]; then
            grep -E "error:|undefined reference|collect2" /tmp/build.log | head -24 |
              while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit "$code"
          fi
      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: /tmp/build.log
          if-no-files-found: ignore
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Bundle runtime DLLs
        run: |
          # UCRT64 ships libmpv's codecs as separate DLLs (avcodec, avformat,
          # swresample, libass, libplacebo, ...), and libmpv resolves them at
          # load time. Copy the whole runtime set instead of only the five
          # DLLs the exe links directly, otherwise mpv fails to start on a
          # machine without MSYS2 installed.
          cp /ucrt64/bin/*.dll "$GITHUB_WORKSPACE/build/"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossfade-windows
          path: |
            build/crossfade.exe
            build/*.dll
            p100-backend.py
            p100-backend-oauth.py
            py/cf_backend/**
            requirements.txt
            packaging/windows/crossfade-login.cmd
            packaging/windows/make_browser_json.py
      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Layout expected by packaging/windows/install.ps1:
          #   crossfade-windows/bin/           exe + all runtime DLLs
          #   crossfade-windows/share/crossfade/ backend + fonts
          $pkg = "crossfade-windows"
          $root = "dist/$pkg"
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Path "$root/bin" -Force | Out-Null
          New-Item -ItemType Directory -Path "$root/share/crossfade/assets" -Force | Out-Null
          Set-Content -Path "dist/version.txt" -Value $ver -Encoding ascii
          Set-Content -Path "$root/version.txt" -Value $ver -Encoding ascii
          Copy-Item build/crossfade.exe "$root/bin/"
          Copy-Item build/*.dll "$root/bin/"
          Copy-Item packaging/windows/crossfade-login.cmd "$root/bin/"
          Copy-Item packaging/windows/install-crossfade.cmd "$root/bin/"
          Copy-Item p100-backend.py, p100-backend-oauth.py, requirements.txt, `
            packaging/windows/make_browser_json.py "$root/share/crossfade/"
          New-Item -ItemType Directory -Path "$root/share/crossfade/py" -Force | Out-Null
          Copy-Item py/cf_backend "$root/share/crossfade/py/cf_backend" -Recurse
          Copy-Item assets/fonts "$root/share/crossfade/assets/fonts" -Recurse
          Copy-Item README.md, LICENSE "$root/"
          # The one-click installer downloads this exact filename from the
          # release page; the scripts themselves are published next to it as
          # standalone assets.
          Copy-Item packaging/windows/install.ps1, packaging/windows/install-crossfade.cmd "dist/"
          Compress-Archive -Path $root -DestinationPath "dist/$pkg.zip"
      - name: Upload Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: crossfade-windows-release
          path: |
            dist/crossfade-windows.zip
            dist/install.ps1
            dist/install-crossfade.cmd
            dist/version.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: crossfade-*-release
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zip
            dist/install.ps1
            dist/install-crossfade.cmd
            dist/version.txt
